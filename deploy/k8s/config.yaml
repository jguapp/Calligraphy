# Non-secret configuration. Secrets (api-tokens, database-url, callback
# secret) live in the `calligraphy-secrets` Secret -- created imperatively or by
# your secret manager, never committed. See deploy/k8s/README.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: calligraphy-config
  namespace: calligraphy
data:
  CALLIGRAPHY_REDIS_ADDR: "redis:6379"
  CALLIGRAPHY_QUEUE: "default"
  CALLIGRAPHY_CONCURRENCY: "4"
  CALLIGRAPHY_AUTOSCALE: "true"
  CALLIGRAPHY_MIN_CONCURRENCY: "2"
  CALLIGRAPHY_MAX_CONCURRENCY: "16"
  CALLIGRAPHY_CONTROL_ADDR: "calligraphy-api:9090"
  CALLIGRAPHY_DRAIN_TIMEOUT: "25s"
