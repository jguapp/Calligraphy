apiVersion: apps/v1
kind: Deployment
metadata:
  name: caligraphy-api
  namespace: caligraphy
spec:
  replicas: 2
  selector:
    matchLabels: { app: caligraphy-api }
  template:
    metadata:
      labels: { app: caligraphy-api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: api
          image: caligraphy-api:latest # built from deploy/docker/Dockerfile --build-arg BINARY=caligraphy-api
          ports:
            - { containerPort: 8080, name: http }
            - { containerPort: 9090, name: grpc }
          envFrom:
            - configMapRef: { name: caligraphy-config }
          env:
            - name: CALIGRAPHY_DATABASE_URL
              valueFrom: { secretKeyRef: { name: caligraphy-secrets, key: database-url } }
            - name: CALIGRAPHY_API_TOKENS
              valueFrom: { secretKeyRef: { name: caligraphy-secrets, key: api-tokens } }
          # httpGet probes: exactly why the scratch image can skip a shell.
          # Liveness is process-local (a Postgres blip must NOT restart the
          # fleet); readiness checks both dependencies.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 250m, memory: 128Mi }
            limits: { memory: 512Mi }
      # Two replicas race for the recovery leader lock; the loser idles on
      # that duty and serves traffic. Losing leadership costs nothing.
---
apiVersion: v1
kind: Service
metadata:
  name: caligraphy-api
  namespace: caligraphy
spec:
  selector: { app: caligraphy-api }
  ports:
    - { name: http, port: 8080 }
    - { name: grpc, port: 9090 }
