# Horizontal scaling for the worker fleet.
#
# Shipped form: CPU-based, because it works on any cluster with
# metrics-server and CPU genuinely is the binding resource for the
# CPU-bound workload class (see bench/BENCHMARKS.md -- throughput
# saturates at core count).
#
# The BETTER signal for I/O-bound fleets is queue depth, and the worker
# already exports it (forge_queue_depth). Wiring it into an HPA needs the
# prometheus-adapter installed; the External metric block below is the
# exact config, left commented until the adapter exists in your cluster:
#
#   prometheus-adapter rule:
#     seriesQuery: 'forge_queue_depth'
#     metricsQuery: 'sum(forge_queue_depth)'
#
#   - type: External
#     external:
#       metric: { name: forge_queue_depth }
#       target: { type: AverageValue, averageValue: "20" }   # ~20 ready jobs per pod
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: forge-worker
  namespace: forge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: forge-worker
  minReplicas: 2
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 75 }
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
    scaleDown:
      # The same grow-eager/shrink-reluctant asymmetry the in-process
      # autoscaler uses, expressed in HPA vocabulary.
      stabilizationWindowSeconds: 300
