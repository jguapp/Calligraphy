    <text x="28" y="110" fill="#ECE5DA">payload: {"failRate":0.05,"permanentRate":0.01,"sleepMs":20}</text>
    <text x="28" y="132" fill="#ECE5DA">submitted 10000 (0 errors) in 4.75s (2107/s)</text>
    <text x="28" y="158" fill="#E8763A">chaos: SIGKILLed worker 3</text>
    <text x="28" y="180" fill="#E8763A">chaos: SIGKILLed worker 6</text>

    <text x="28" y="212" fill="#7A6E5F">── reliability-10k ─────────────────────────────────────</text>
    <text x="28" y="238" fill="#ECE5DA">  wall            41.40s        throughput   239.2 jobs/s</text>
    <text x="28" y="260" fill="#8FBF7F">  completed       9904/10000 (99.04%)</text>
    <text x="28" y="282" fill="#ECE5DA">  failed          96 permanent (injected), 0 dead-lettered</text>
    <text x="28" y="304" fill="#ECE5DA">  retried jobs    485 (10485 total attempts for 10000 jobs)</text>
    <text x="28" y="326" fill="#ECE5DA">  e2e latency     p50 5357ms   p95 12418ms   p99 15168ms</text>
