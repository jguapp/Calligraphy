<svg width="860" height="392" viewBox="0 0 860 392" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terminal output of the 10,000-job reliability run">
  <defs>
    <linearGradient id="tbg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1D1915"/>
      <stop offset="100%" stop-color="#17140F"/>
    </linearGradient>
  </defs>

  <!-- window chrome -->
  <rect x="0.5" y="0.5" width="859" height="391" rx="10" fill="url(#tbg)" stroke="#332A21"/>
  <circle cx="24" cy="22" r="6" fill="#5A4A3A"/>
  <circle cx="44" cy="22" r="6" fill="#5A4A3A"/>
  <circle cx="64" cy="22" r="6" fill="#5A4A3A"/>
  <text x="430" y="27" font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="12" fill="#7A6E5F" text-anchor="middle">bench/scripts/matrix.sh reliability — real output, 2026-08-09</text>

  <!-- body: the actual run output, verbatim -->
  <g font-family="'SFMono-Regular',Consolas,Menlo,monospace" font-size="14">
    <text x="28" y="62" fill="#A89A8A">$ bench/scripts/matrix.sh reliability</text>
