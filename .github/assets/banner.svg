<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Caligraphy">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16130F"/>
      <stop offset="100%" stop-color="#211B14"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8763A" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#E8763A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="heat" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E8763A"/>
      <stop offset="100%" stop-color="#F2A65A"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="640" height="320" fill="url(#glow)"/>

  <!-- pen-nib mark; three ink drops for the three moving pieces:
       queue, workers, record -->
  <g transform="translate(92, 86)">
    <g stroke="#E8763A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- nib body: shoulders tapering to the point -->
      <path d="M52 4 C70 18 84 36 84 54 C84 74 70 92 52 104 C34 92 20 74 20 54 C20 36 34 18 52 4 Z"/>
      <!-- slit from breather hole to the point -->
      <circle cx="52" cy="52" r="7"/>
      <path d="M52 59 V96"/>
    </g>
    <!-- ink drops falling from the point -->
    <g fill="url(#heat)">
      <circle cx="104" cy="20" r="4"/>
      <circle cx="118" cy="38" r="3"/>
      <circle cx="110" cy="56" r="2.5"/>
    </g>
    <!-- ink stroke under the nib -->
    <path d="M14 122 C40 114 68 114 92 122" stroke="#E8763A" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.5"/>
  </g>

  <text x="248" y="172" font-family="Georgia, 'Times New Roman', serif" font-size="76" fill="#ECE5DA" font-weight="700">Caligraphy</text>
  <text x="252" y="214" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#A89A8A" letter-spacing="0.3">Submit work. Kill the worker. Get the result anyway.</text>

  <line x1="92" y1="252" x2="940" y2="252" stroke="#332A21" stroke-width="1.5"/>
  <text x="92" y="286" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#7A6E5F">A distributed job-processing platform in Go — Redis Streams transport, Postgres truth, fenced writes, honest benchmarks</text>
</svg>
